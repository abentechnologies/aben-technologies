<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_152 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_152" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_152');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const mountEl = container || document.getElementById('hero-sculpture-canvas') || document.body;
  let width = mountEl.clientWidth || 480;
  let height = mountEl.clientHeight || 480;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
  camera.position.set(0, 0, 8.5);

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;

  mountEl.innerHTML = '';
  mountEl.appendChild(renderer.domElement);

  // Studio lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
  scene.add(ambientLight);

  const mainLight = new THREE.DirectionalLight(0xff6900, 3.5);
  mainLight.position.set(5, 8, 6);
  scene.add(mainLight);

  const fillLight = new THREE.DirectionalLight(0xffeedd, 2.0);
  fillLight.position.set(-6, -4, 4);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xff9944, 2.5);
  rimLight.position.set(0, -6, -5);
  scene.add(rimLight);

  // Group for the sculpture
  const sculptureGroup = new THREE.Group();
  scene.add(sculptureGroup);

  // Elegant Mobius / Ribbon knot sculpture
  // Parametric geometry creating a fluid, architectural ribbon loop
  const curvePoints = [];
  const segments = 160;
  for (let i = 0; i <= segments; i++) {
    const u = (i / segments) * Math.PI * 2;
    // Trefoil / Torus knot with elegant proportions
    const x = Math.sin(u) + 2 * Math.sin(2 * u) * 0.9;
    const y = Math.cos(u) - 2 * Math.cos(2 * u) * 0.9;
    const z = -Math.sin(3 * u) * 0.85;
    curvePoints.push(new THREE.Vector3(x * 0.85, y * 0.85, z * 0.85));
  }
  const curve = new THREE.CatmullRomCurve3(curvePoints, true, 'centripetal');
  const tubeGeo = new THREE.TubeGeometry(curve, 180, 0.32, 32, true);

  // Refined material: Satin Matte Polymeric Orange with subtle metallic sheen
  const orangeMat = new THREE.MeshStandardMaterial({
    color: 0xff6500,
    roughness: 0.28,
    metalness: 0.35,
    wireframe: false
  });

  const tubeMesh = new THREE.Mesh(tubeGeo, orangeMat);
  sculptureGroup.add(tubeMesh);

  // Inner floating polished titanium core ring
  const innerRingGeo = new THREE.TorusGeometry(1.4, 0.04, 16, 100);
  const innerRingMat = new THREE.MeshStandardMaterial({
    color: 0xe0e0e0,
    roughness: 0.15,
    metalness: 0.85
  });
  const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
  innerRing.rotation.x = Math.PI / 3;
  sculptureGroup.add(innerRing);

  // Subtle mouse interaction
  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
  });

  // Slow, serene rotation
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    sculptureGroup.rotation.y = t * 0.25 + mouseX * 0.6;
    sculptureGroup.rotation.x = Math.sin(t * 0.18) * 0.15 + mouseY * 0.6;
    sculptureGroup.rotation.z = Math.cos(t * 0.15) * 0.1;

    innerRing.rotation.z = -t * 0.35;

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    width = mountEl.clientWidth || 480;
    height = mountEl.clientHeight || 480;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  });
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_152 -->
</body>
</html>
