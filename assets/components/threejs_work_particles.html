<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_133 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_133" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_133');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Particle System: Cinematic "WORK" Assembly
(function() {
  const mountEl = container || document.getElementById('work-particle-canvas-container') || document.body;
  
  // Safe dimensions to avoid 0x0 collapse
  let width = mountEl.clientWidth || window.innerWidth || 1200;
  let height = mountEl.clientHeight || 650;
  if (height < 300) height = 650;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 2000);
  camera.position.z = 210;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);

  mountEl.innerHTML = '';
  mountEl.appendChild(renderer.domElement);

  // Raster text mask for dense typography sampling of "WORK"
  const textCanvas = document.createElement('canvas');
  textCanvas.width = 1400;
  textCanvas.height = 420;
  const tCtx = textCanvas.getContext('2d', { willReadFrequently: true });

  tCtx.fillStyle = '#000000';
  tCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);
  tCtx.fillStyle = '#ffffff';
  // Ultra-bold sans font for strong readability
  tCtx.font = '900 240px "Syne", "Impact", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  tCtx.textAlign = 'center';
  tCtx.textBaseline = 'middle';
  tCtx.fillText('WORK', textCanvas.width / 2, textCanvas.height / 2);

  const imgData = tCtx.getImageData(0, 0, textCanvas.width, textCanvas.height);
  const targets = [];
  const step = 4; // Dense sampling step

  for (let y = 0; y < textCanvas.height; y += step) {
    for (let x = 0; x < textCanvas.width; x += step) {
      const idx = (y * textCanvas.width + x) * 4;
      if (imgData.data[idx] > 120) {
        const targetX = (x - textCanvas.width / 2) * 0.22;
        const targetY = -(y - textCanvas.height / 2) * 0.22;
        const targetZ = (Math.random() - 0.5) * 8;
        targets.push({ x: targetX, y: targetY, z: targetZ });
      }
    }
  }

  const particleCount = Math.max(targets.length, 5200);
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const originPositions = new Float32Array(particleCount * 3);
  const targetPositions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);
  const delays = new Float32Array(particleCount);
  const phases = new Float32Array(particleCount);

  const orangeBrand = new THREE.Color('#FF6500');
  const flameAccent = new THREE.Color('#FFA834');
  const pureWhite = new THREE.Color('#FFFFFF');
  const subtleSilver = new THREE.Color('#D1D5DB');

  for (let i = 0; i < particleCount; i++) {
    // Phase 1: Dispersed 3D scatter
    const theta = Math.random() * Math.PI * 2;
    const phi = (Math.random() - 0.5) * Math.PI;
    const radius = 180 + Math.random() * 320;

    const ox = radius * Math.cos(theta) * Math.cos(phi) * 1.5;
    const oy = radius * Math.sin(phi) * 1.1;
    const oz = (Math.random() - 0.5) * 360;

    originPositions[i * 3] = ox;
    originPositions[i * 3 + 1] = oy;
    originPositions[i * 3 + 2] = oz;

    positions[i * 3] = ox;
    positions[i * 3 + 1] = oy;
    positions[i * 3 + 2] = oz;

    if (i < targets.length) {
      targetPositions[i * 3] = targets[i].x;
      targetPositions[i * 3 + 1] = targets[i].y;
      targetPositions[i * 3 + 2] = targets[i].z;
    } else {
      const randT = targets[Math.floor(Math.random() * targets.length)] || { x: 0, y: 0, z: 0 };
      targetPositions[i * 3] = randT.x + (Math.random() - 0.5) * 2;
      targetPositions[i * 3 + 1] = randT.y + (Math.random() - 0.5) * 2;
      targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 4;
    }

    const roll = Math.random();
    let col = pureWhite;
    if (roll < 0.50) {
      col = orangeBrand;
    } else if (roll < 0.75) {
      col = flameAccent;
    } else if (roll < 0.95) {
      col = pureWhite;
    } else {
      col = subtleSilver;
    }

    colors[i * 3] = col.r;
    colors[i * 3 + 1] = col.g;
    colors[i * 3 + 2] = col.b;

    sizes[i] = Math.random() * 2.2 + 2.2;
    delays[i] = Math.random() * 0.45;
    phases[i] = Math.random() * Math.PI * 2;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // Glowing particle texture
  const pCanvas = document.createElement('canvas');
  pCanvas.width = 64;
  pCanvas.height = 64;
  const pCtx = pCanvas.getContext('2d');
  const grad = pCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
  grad.addColorStop(0.25, 'rgba(255, 160, 40, 0.9)');
  grad.addColorStop(0.6, 'rgba(255, 101, 0, 0.45)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  pCtx.fillStyle = grad;
  pCtx.fillRect(0, 0, 64, 64);

  const pTexture = new THREE.CanvasTexture(pCanvas);
  pTexture.generateMipmaps = false;
  pTexture.minFilter = THREE.LinearFilter;

  const material = new THREE.PointsMaterial({
    size: 3.8,
    vertexColors: true,
    map: pTexture,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const particleSystem = new THREE.Points(geometry, material);
  scene.add(particleSystem);

  let mouseX = 0;
  let mouseY = 0;
  let targetRotX = 0;
  let targetRotY = 0;

  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX - window.innerWidth / 2) * 0.00035;
    mouseY = (e.clientY - window.innerHeight / 2) * 0.00035;
  });

  const startTime = performance.now();

  function animate(now) {
    requestAnimationFrame(animate);
    const elapsed = (now - startTime) * 0.001;

    const posAttr = geometry.attributes.position;
    const currentPositions = posAttr.array;

    const animDuration = 1.9;
    const animStart = 0.25;

    for (let i = 0; i < particleCount; i++) {
      const idx = i * 3;
      const ox = originPositions[idx];
      const oy = originPositions[idx + 1];
      const oz = originPositions[idx + 2];

      const tx = targetPositions[idx];
      const ty = targetPositions[idx + 1];
      const tz = targetPositions[idx + 2];

      const delay = delays[i];
      const rawProgress = Math.max(0, Math.min(1, (elapsed - animStart - delay) / animDuration));
      const easeT = 1 - Math.pow(1 - rawProgress, 4);

      if (rawProgress < 1.0) {
        const vortex = Math.sin(rawProgress * Math.PI) * (1 - easeT) * 16;
        currentPositions[idx] = ox + (tx - ox) * easeT + Math.sin(elapsed * 4 + i) * vortex;
        currentPositions[idx + 1] = oy + (ty - oy) * easeT + Math.cos(elapsed * 4 + i) * vortex;
        currentPositions[idx + 2] = oz + (tz - oz) * easeT;
      } else {
        const phase = phases[i];
        const jitter = (i % 8 === 0) ? 0.9 : 0.35;
        const jx = Math.sin(elapsed * 3.0 + phase) * jitter;
        const jy = Math.cos(elapsed * 2.5 + phase * 1.2) * jitter;
        const jz = Math.sin(elapsed * 2.0 + phase * 0.8) * jitter;

        const breathe = Math.sin(elapsed * 1.5) * 0.008;

        currentPositions[idx] = tx * (1 + breathe) + jx;
        currentPositions[idx + 1] = ty * (1 + breathe) + jy;
        currentPositions[idx + 2] = tz + jz;
      }
    }

    posAttr.needsUpdate = true;

    targetRotY += (mouseX - targetRotY) * 0.05;
    targetRotX += (mouseY - targetRotX) * 0.05;
    particleSystem.rotation.y = targetRotY;
    particleSystem.rotation.x = targetRotX;

    renderer.render(scene, camera);
  }

  requestAnimationFrame(animate);

  window.addEventListener('resize', () => {
    const newW = mountEl.clientWidth || window.innerWidth || 1200;
    const newH = mountEl.clientHeight || 650;
    camera.aspect = newW / newH;
    camera.updateProjectionMatrix();
    renderer.setSize(newW, newH);
  });
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_133 -->
</body>
</html>
